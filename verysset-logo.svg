<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 88" width="372" height="88" role="img" aria-label="VERYSSET">
  <title>VERYSSET</title>
  <defs>
    <!-- Isometric cube: one yellow ramp #FFD400 -> #E6BF00, angled per face -->
    <linearGradient id="vsFaceTop" gradientUnits="userSpaceOnUse" x1="30" y1="14" x2="70" y2="46">
      <stop offset="0" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#E6BF00"/>
    </linearGradient>
    <linearGradient id="vsFaceLeft" gradientUnits="userSpaceOnUse" x1="22" y1="30" x2="46" y2="76">
      <stop offset="0" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#E6BF00"/>
    </linearGradient>
    <linearGradient id="vsFaceRight" gradientUnits="userSpaceOnUse" x1="52" y1="32" x2="74" y2="74">
      <stop offset="0" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#E6BF00"/>
    </linearGradient>
  </defs>

  <!-- SYMBOL: isometric cube (hexahedron) -->
  <g>
    <!-- solid base so face seams never show a hairline gap -->
    <path d="M46 12 L74 28 L74 60 L46 76 L18 60 L18 28 Z" fill="#E6BF00"/>
    <!-- top face (lightest) -->
    <path d="M46 12 L74 28 L46 44 L18 28 Z" fill="url(#vsFaceTop)"/>
    <!-- left face (mid) -->
    <path d="M18 28 L46 44 L46 76 L18 60 Z" fill="url(#vsFaceLeft)"/>
    <path d="M18 28 L46 44 L46 76 L18 60 Z" fill="#000000" opacity="0.06"/>
    <!-- right face (deepest) -->
    <path d="M46 44 L74 28 L74 60 L46 76 Z" fill="url(#vsFaceRight)"/>
    <path d="M46 44 L74 28 L74 60 L46 76 Z" fill="#000000" opacity="0.13"/>
  </g>

  <!-- WORDMARK -->
  <text x="104" y="59"
        font-family="Arial, Helvetica, 'Helvetica Neue', sans-serif"
        font-weight="700" font-size="42" letter-spacing="3"
        fill="#0A0A09" xml:space="preserve">VERYSSET</text>
</svg>
